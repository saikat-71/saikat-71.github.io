<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Live GitHub Repositories | Saikat</title><link rel="icon" href="images/Favicon.PNG"><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"></head><body><div class="cursor-dot" aria-hidden="true"></div><div class="cursor-ring" aria-hidden="true"></div><canvas id="particles"></canvas><header class="header"><nav class="nav container"><a class="brand brand-logo" href="index.html"><img src="images/Logo.png" alt="Saikat"></a><div class="subnav-actions"><button class="theme-toggle" id="themeToggle" aria-label="Toggle dark and light mode"><i class="fa-solid fa-sun"></i></button><a class="btn btn-ghost" href="index.html#projects"><i class="fa-solid fa-arrow-left"></i> Back to Portfolio</a></div></nav></header><main class="section github-page"><div class="container"><div class="section-head center"><span>GITHUB / LIVE DATA</span><h1>My <em>public repositories.</em></h1><p>This page loads the latest public repository data directly from the GitHub API.</p></div><div class="github-profile-card"><div><i class="fa-brands fa-github"></i><div><strong>saikat-71</strong><span id="githubStatus">Loading live GitHub data...</span></div></div><a class="btn btn-primary" href="https://github.com/saikat-71" target="_blank" rel="noopener">Open GitHub <i class="fa-solid fa-arrow-up-right-from-square"></i></a></div><div id="repoGrid" class="repo-grid repo-grid-page"></div></div></main><script>const repoGrid=document.getElementById('repoGrid'),status=document.getElementById('githubStatus');function esc(v){return String(v||'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#039;','"':'&quot;'}[c]))}fetch('https://api.github.com/users/saikat-71/repos?sort=updated&direction=desc&per_page=30').then(r=>{if(!r.ok)throw Error();return r.json()}).then(repos=>{status.textContent=`${repos.length} public repositories • live from GitHub`;repoGrid.innerHTML=repos.length?repos.map(r=>`<article class="repo-card repo-card-large"><div class="repo-title"><i class="fa-regular fa-folder"></i><h3>${esc(r.name)}</h3></div><p>${esc(r.description||'Public GitHub repository')}</p><div class="repo-meta"><span><b>★</b> ${r.stargazers_count}</span><span><b>⑂</b> ${r.forks_count}</span><span>${esc(r.language||'Code')}</span></div><a href="${r.html_url}" target="_blank" rel="noopener">View repository <i class="fa-solid fa-arrow-right"></i></a></article>`).join(''):'<p class="skill-note">No public repositories found.</p>'}).catch(()=>{status.textContent='GitHub data unavailable right now';repoGrid.innerHTML='<div class="repo-error"><i class="fa-solid fa-triangle-exclamation"></i><p>Could not load live GitHub data. Please try again later or open the GitHub profile directly.</p></div>'});</script><script>(function(){const body=document.body,t=document.getElementById('themeToggle'),saved=localStorage.getItem('saikat-theme');if(saved==='light')body.classList.add('light');if(t)t.addEventListener('click',()=>{body.classList.toggle('light');localStorage.setItem('saikat-theme',body.classList.contains('light')?'light':'dark');t.querySelector('i').className=body.classList.contains('light')?'fa-solid fa-moon':'fa-solid fa-sun'});const dot=document.querySelector('.cursor-dot'),ring=document.querySelector('.cursor-ring');if(dot&&ring&&matchMedia('(pointer:fine)').matches){let x=innerWidth/2,y=innerHeight/2,rx=x,ry=y;addEventListener('mousemove',e=>{x=e.clientX;y=e.clientY;dot.style.transform=`translate(${x}px,${y}px) translate(-50%,-50%)`});(function loop(){rx+=(x-rx)*.18;ry+=(y-ry)*.18;ring.style.transform=`translate(${rx}px,${ry}px) translate(-50%,-50%)`;requestAnimationFrame(loop)})();document.querySelectorAll('a,button,.repo-card').forEach(el=>{el.addEventListener('mouseenter',()=>ring.classList.add('active'));el.addEventListener('mouseleave',()=>ring.classList.remove('active'))})}const canvas=document.getElementById('particles'),ctx=canvas&&canvas.getContext('2d');if(canvas&&ctx){let ps=[];function resize(){canvas.width=innerWidth;canvas.height=innerHeight;ps=Array.from({length:Math.min(65,Math.floor(innerWidth/20))},()=>({x:Math.random()*innerWidth,y:Math.random()*innerHeight,vx:(Math.random()-.5)*.22,vy:(Math.random()-.5)*.22,r:Math.random()*1.4+.4}))}function draw(){ctx.clearRect(0,0,canvas.width,canvas.height);const light=body.classList.contains('light');ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>innerWidth)p.vx*=-1;if(p.y<0||p.y>innerHeight)p.vy*=-1;ctx.fillStyle=light?'rgba(7,158,114,.25)':'rgba(32,227,162,.25)';ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fill()});requestAnimationFrame(draw)}addEventListener('resize',resize);resize();draw()}})();</script></body></html>

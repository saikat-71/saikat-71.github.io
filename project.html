</head><body data-page="project"><div class="cursor-dot" aria-hidden="true"></div><div class="cursor-ring" aria-hidden="true"></div><canvas id="particles"></canvas><!-- Shared header rendered by site-common.js --><main class="section project-detail"><div class="container"><div id="projectDetail"></div></div></main><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const id=new URLSearchParams(location.search).get('id')||'bakery';
async function load(){
  try{
    const r=await fetch('data/portfolio.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok) throw new Error('Content is temporarily unavailable');
    const data=await r.json();
    const p=(data.projects||[]).find(x=>x.id===id)||(data.projects||[])[0];
    const root=document.getElementById('projectDetail');
    if(!p){root.innerHTML='<div class="collection-empty"><strong>Project not found.</strong><a class="btn btn-primary" href="projects.html">Back to Projects</a></div>';return;}
    root.innerHTML=`<div class="project-detail-hero"><div class="project-detail-image"><img src="${esc(p.cover||'images/Logo.webp')}" alt="${esc(p.title)} project cover" loading="lazy" decoding="async"><span>${esc(p.label||'PROJECT')}</span></div><div class="project-detail-copy"><span class="eyebrow">PROJECT DETAIL</span><h1>${esc(p.title)}</h1><p>${esc(p.overview||p.description||'')}</p><div class="tags">${(p.tech||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="hero-actions"><a class="btn btn-primary magnetic" href="${esc(p.repo||'#')}" target="_blank" rel="noopener"><i class="fa-brands fa-github"></i> GitHub Repository</a>${p.report?`<a class="btn btn-ghost magnetic" href="${esc(p.report)}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> View Report PDF</a>`:''}</div></div></div>
<div class="detail-grid"><section class="detail-section"><span class="eyebrow">01 / CONTEXT</span><h2>Problem & approach</h2><div class="detail-box"><h3>Problem</h3><p>${esc(p.problem||p.description||'')}</p><h3>Solution / Approach</h3><p>${esc(p.solution||'Project work focused on applying the listed technologies to address the project objective.')}</p></div></section><section class="detail-section"><span class="eyebrow">02 / ROLE</span><h2>Project information</h2><div class="detail-box"><p><strong>Role:</strong> ${esc(p.role||'Academic project')}</p><p><strong>Technologies:</strong> ${(p.tech||[]).map(esc).join(', ')}</p></div></section></div>
<section class="detail-section"><span class="eyebrow">03 / HIGHLIGHTS</span><h2>Key features & work</h2><div class="feature-grid">${(p.highlights||[]).map((x,i)=>`<div class="feature-card"><span>${String(i+1).padStart(2,'0')}</span><p>${esc(x)}</p></div>`).join('')}</div></section>`;
  }catch(e){
    document.getElementById('projectDetail').innerHTML='<div class="collection-empty"><i class="fa-solid fa-circle-exclamation"></i><strong>Project data could not be loaded.</strong><span>Please open the portfolio through GitHub Pages or a local web server.</span></div>';
  }
}
load();
</script><style>
.project-detail{padding-top:135px;padding-bottom:80px}.project-detail-hero{display:grid;grid-template-columns:1fr 1fr;gap:55px;align-items:center}.project-detail-image{position:relative}.project-detail-image img{width:100%;aspect-ratio:16/10;object-fit:cover;border-radius:22px;border:1px solid var(--line);box-shadow:0 28px 80px rgba(0,0,0,.28)}.project-detail-image>span{position:absolute;left:18px;bottom:18px;padding:7px 10px;border-radius:7px;background:rgba(4,10,16,.82);color:#fff;font-size:10px;font-weight:800;letter-spacing:1.5px}.project-detail-copy h1{font-size:clamp(38px,5vw,66px);line-height:1.05;margin:10px 0 16px}.project-detail-copy>p{color:var(--muted);font-size:16px;max-width:650px}.detail-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:22px}.detail-section{margin-top:75px}.detail-section>h2{font-size:32px;margin:7px 0 18px}.detail-box{padding:25px;background:var(--panel);border:1px solid var(--line);border-radius:15px}.detail-box h3{font-size:16px;margin-bottom:6px}.detail-box h3:not(:first-child){margin-top:20px}.detail-box p{color:var(--muted);margin:5px 0}.feature-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.feature-card{padding:20px;background:var(--panel);border:1px solid var(--line);border-radius:13px}.feature-card span{color:var(--accent);font-size:11px;font-weight:800}.feature-card p{margin-top:9px;color:#c4cedb;font-size:13px}

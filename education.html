</head><body data-page="education"><div class="cursor-dot" aria-hidden="true"></div><div class="cursor-ring" aria-hidden="true"></div><canvas id="particles"></canvas><!-- Shared header rendered by site-common.js --><main class="section subpage"><div class="container"><div class="section-head center"><span>05 / EDUCATION</span><h1>Academic <em>background.</em></h1><p>My academic journey from secondary education to undergraduate study.</p></div><div id="educationPageList" class="education-list"></div><div class="center"><a class="btn btn-primary magnetic" href="documents/CV.pdf" target="_blank"><i class="fa-solid fa-file-pdf"></i> View CV</a></div></div></main><!-- Shared footer rendered by site-common.js --><script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));

(async()=>{
  let items=[];
  try{
    const r=await fetch('data/portfolio.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Content is temporarily unavailable');
    const d=await r.json();items=Array.isArray(d.education)?d.education:[];
  }catch(e){console.error('Portfolio content could not be retrieved.',e);}
  const root=document.getElementById('educationPageList');
  if(root)root.innerHTML=items.map(e=>{const category=e.category||(/B\.Sc|Bachelor|Undergraduate/i.test(e.title||'')?'Undergraduate':/HSC|Higher Secondary/i.test(e.title||'')?'HSC':'SSC');return `<article class="education" data-category="${esc(category)}"><div class="edu-icon"><i class="${esc(e.icon||'fa-solid fa-graduation-cap')}"></i></div><div><div class="edu-date">${esc(e.date||'')}</div><h3>${esc(e.title||'')}</h3><h4>${esc(e.institution||'')}</h4>${e.major?`<div class="edu-major"><span>Major / Group</span><strong>${esc(e.major)}</strong></div>`:''}<p>${esc(e.description||'')}</p></div></article>`}).join('')||'<div class="collection-empty"><strong>Academic records are currently unavailable.</strong></div>';
})();
</script><script src="site-common.js"></script><script src="analytics.js" defer></script><script src="enhancements.js"></script></body></html>

<!-- Shared header rendered by site-common.js -->
<main class="section subpage"><div class="container"><div class="section-head center"><span>03A / PROJECTS</span><h1>All <em>projects.</em></h1><p>Browse every project. Explore the complete collection of software, data, and technology projects.</p></div><div id="allProjectsGrid" class="project-grid"></div></div></main>
<!-- Shared footer rendered by site-common.js -->
<script>const y=document.getElementById('year');if(y)y.textContent=new Date().getFullYear();</script>
<script>
const esc=v=>String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const categoryFor=p=>p.category||(/analytics|data|forecast/i.test((p.title||'')+' '+(p.role||''))?'Data Analytics':/machine|ml|predict/i.test(p.title||'')?'Machine Learning':/design|graphic/i.test((p.title||'')+' '+(p.role||''))?'Design':'Software Development');
function renderProjects(items){
  const root=document.getElementById('allProjectsGrid');if(!root)return;
  root.innerHTML=(items||[]).map((p,i)=>{
    const cat=categoryFor(p);
    return `<article class="project" data-category="${esc(cat)}"><div class="project-cover"><img src="${esc(p.cover||'images/Logo.webp')}" alt="${esc(p.title)} project cover" loading="lazy" decoding="async"><div class="cover-label">${esc(p.label||cat||'PROJECT')}</div></div><div class="project-top"><span class="project-number">${String(i+1).padStart(2,'0')}</span>${p.repo?`<a href="${esc(p.repo)}" target="_blank" rel="noopener" aria-label="Open GitHub"><i class="fa-brands fa-github"></i></a>`:''}</div><h3>${esc(p.title)}</h3><p>${esc(p.description||'')}</p><div class="tags">${(p.tech||[]).map(x=>`<span>${esc(x)}</span>`).join('')}</div><div class="project-actions"><a class="project-details btn btn-primary" href="project.html?id=${encodeURIComponent(p.id)}"><i class="fa-solid fa-arrow-right"></i> View project</a>${p.report?`<a class="report-link" href="${esc(p.report)}" target="_blank" rel="noopener"><i class="fa-solid fa-file-pdf"></i> Report</a>`:''}</div></article>`;
  }).join('')||'<div class="collection-empty"><i class="fa-solid fa-folder-open"></i><strong>No projects available</strong><span>Project information will be presented here as the portfolio grows.</span></div>';
  document.dispatchEvent(new CustomEvent('portfolio:projects-rendered'));
}
(async()=>{
  try{
    const r=await fetch('data/portfolio.json?ts='+Date.now(),{cache:'no-store'});
    if(!r.ok)throw new Error('Content is temporarily unavailable');
    const d=await r.json();
    renderProjects(Array.isArray(d.projects)?d.projects:[]);
    document.dispatchEvent(new CustomEvent('portfolio:loaded',{detail:d}));
  }catch(e){
    console.error('Portfolio content could not be retrieved.',e);
    renderProjects([]);
  }
})();</script><script src="site-common.js"></script><script src="analytics.js" defer></script><script src="enhancements.js"></script></body></html>
